services:

  db:
    build: ./db
    container_name: mysql_kontener

    environment:
      MYSQL_ROOT_PASSWORD: q
      MYSQL_DATABASE: wydarzenia

    volumes:
      - mysql_data:/var/lib/mysql


  web:
    build: ./web
    container_name: flask_kontener

    ports:
      - "5000:5000" #host:container

    depends_on:
      - db

  mongo:
    image: mongo:7
    container_name: mongo_kontener

    volumes:
      - mongo_data:/data/db

  logger:
    build: ./logger
    container_name: logger_kontener

    depends_on:
      - db
      - mongo

volumes:
  mysql_data:
  mongo_data: