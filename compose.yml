services:

  db:
    build: ./db
    container_name: mysql_kontener
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: ./web
    container_name: flask_kontener
    ports:
      - "5000:5000" #host:container
    depends_on:
      - db
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      WEB_PASSWORD: ${WEB_PASSWORD}

  mongo1:
    image: mongo:7
    container_name: mongo_kontener1
    command: ["mongod", "--replSet", "rs0"]
    volumes:
      - mongo1_data:/data/db

  mongo2:
    image: mongo:7
    container_name: mongo_kontener2
    command: ["mongod", "--replSet", "rs0"]
    volumes:
      - mongo2_data:/data/db

  mongo3:
    image: mongo:7
    container_name: mongo_kontener3
    command: ["mongod", "--replSet", "rs0"]
    volumes:
      - mongo3_data:/data/db

  mongo-init:
    image: mongo:7
    container_name: mongo_init_kontener
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    volumes:
      - ./mongo/mongo-init.sh:/mongo-init.sh
    entrypoint: ["/bin/sh", "/mongo-init.sh"]

  logger:
    build: ./logger
    container_name: logger_kontener
    depends_on:
      - db
      - mongo1
      - mongo2
      - mongo3
      - mongo-init
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MONGO_URI: ${MONGO_URI}

volumes:
  mysql_data:
  mongo1_data:
  mongo2_data:
  mongo3_data: